output_dir: "./outputs"
num_train_epochs: 1
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
gradient_accumulation_steps: 2
learning_rate: 2e-4
warmup_steps: 100
logging_steps: 50
eval_steps: 500
save_steps: 500
save_total_limit: 2
optim: "paged_adamw_32bit"
max_grad_norm: 0.3
seed: 42
mixed_precision: "fp16"
gradient_checkpointing: true
